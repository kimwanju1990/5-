<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>앨리스의 정원 파티 - 틀린 그림 찾기</title>
<style>
:root{--ink:#382719;--cream:#fff8e9;--gold:#d49b37;--green:#4b704c;--red:#b54139}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#fff8e9,#ead7b5);color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif}
main{max-width:1100px;margin:auto;padding:16px} header{text-align:center;padding:8px 0 12px}
h1{font-size:clamp(1.55rem,4vw,2.5rem);margin:0 0 6px} .sub{margin:0;color:#6f5740}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.pill{background:#fffdf6;border:1px solid #d7c29f;border-radius:999px;padding:9px 14px;font-weight:700}
#lives{color:var(--red)} #hints{color:#8b641b}
.instructions{text-align:center;line-height:1.6;margin:8px auto 16px}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:#fffaf0;border:2px solid #b59a6e;border-radius:14px;padding:8px;box-shadow:0 5px 16px #4d33151a;min-width:0}
.panel h2{text-align:center;font-size:1.05rem;margin:4px 0 9px}
.scene{position:relative;line-height:0;overflow:hidden;border-radius:7px;cursor:crosshair;touch-action:manipulation}
.scene img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.mark{position:absolute;transform:translate(-50%,-50%);width:8%;aspect-ratio:1;border:3px solid #ffda43;border-radius:50%;background:#ffdf5340;box-shadow:0 0 0 2px #39271980;pointer-events:none}
.hint{position:absolute;transform:translate(-50%,-50%);width:10%;aspect-ratio:1;border:4px dashed #e64f44;border-radius:50%;pointer-events:none;animation:pulse 1s infinite}
@keyframes pulse{50%{scale:1.15;opacity:.45}}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
button{border:0;border-radius:10px;padding:11px 17px;font-size:1rem;font-weight:700;cursor:pointer}
#hintBtn{background:#f3d48b;color:#49351b} #resetBtn{background:#e9e0d0;color:#4a3926}
button:disabled{opacity:.45;cursor:not-allowed} .status{text-align:center;min-height:28px;font-weight:700;color:var(--green)}
footer{text-align:center;color:#79644d;font-size:.85rem;margin:14px 0 4px}
.overlay{position:fixed;inset:0;background:#20170fc9;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.dialog{background:var(--cream);border:3px solid #d8ad55;border-radius:20px;padding:26px 22px;text-align:center;max-width:420px;width:100%;box-shadow:0 15px 50px #0005}
.dialog h2{font-size:1.7rem;margin:0 0 10px} .answer{font-size:3.5rem;font-weight:900;letter-spacing:.12em;color:var(--red);margin:12px 0}
.dialog p{line-height:1.65} .dialog button{background:var(--green);color:white}
@media(max-width:650px){main{padding:10px}.boards{grid-template-columns:1fr;gap:12px}.panel{padding:6px}.instructions{font-size:.93rem}.pill{padding:8px 11px;font-size:.92rem}}
</style></head><body><main>

<div class="status" id="status" aria-live="polite">준비되면 그림에서 다른 곳을 찾아 눌러 보세요!</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="dialog"><h2 id="dialogTitle">🎉 모두 찾았어요!</h2><p id="dialogText">틀린 그림 5개를 모두 찾았습니다.<br>다음 문제의 정답은</p><div class="answer" id="answer">2024</div><p id="answerNote"><b>숫자 2024를 기억하세요!</b></p><button id="closeBtn">확인</button></div></div>
<script>
(()=>{
 // 정답 판정은 각 차이의 중심을 기준으로 원형에 가까운 타원 영역을 사용합니다. 기존보다 반경을 1.5배 넓혔습니다.
 const diffs=[
  {name:"고양이 얼굴",x:0.775,y:0.015,w:0.085,h:0.10,hint:"나무 위 고양이의 얼굴 부분을 비교해 보세요.",cx:.835,cy:.065,mw:0.11,mh:0.13},
  {name:"토끼 모자 스티커",x:0.765,y:0.285,w:0.085,h:0.105,hint:"토끼 귀가 아니라 모자 앞면의 숫자와 알파벳 표시를 비교해 보세요.",cx:.807,cy:.337,mw:0.10,mh:0.12},
  {name:"카드 무늬",x:0.485,y:0.765,w:0.085,h:0.095,hint:"탁자 가운데 아래쪽 카드의 무늬를 살펴보세요.",cx:.527,cy:.812,mw:0.10,mh:0.12},
  {name:"왼쪽 아래 쥐",x:0.185,y:0.735,w:0.12,h:0.13,hint:"왼쪽 아래 찻잔 안에 있는 쥐의 얼굴과 몸을 살펴보세요.",cx:.245,cy:.795,mw:0.12,mh:0.15},
  {name:"오른쪽 아래 쥐",x:0.685,y:0.735,w:0.12,h:0.13,hint:"오른쪽 아래 찻잔 안에 있는 쥐의 얼굴과 몸을 살펴보세요.",cx:.745,cy:.79,mw:0.12,mh:0.15}
 ];
 let found=new Set(),lives=3,hints=3,ended=false;
 const $=id=>document.getElementById(id),scenes=[$("sceneA"),$("sceneB")];
 function update(){$("found").textContent=found.size;$("lifeCount").textContent=lives;$("hintCount").textContent=hints;$("hintBtn").disabled=hints<=0||ended||found.size===5;}
 function mark(scene,i,cls="mark"){const d=diffs[i],m=document.createElement("span");m.className=cls;m.dataset.i=i;m.style.left=(d.cx*100)+"%";m.style.top=(d.cy*100)+"%";m.style.width=((d.mw||0.09)*100)+"%";m.style.height=((d.mh||0.09)*100)+"%";m.style.aspectRatio="auto";scene.appendChild(m);}
 function clearHints(){scenes.forEach(s=>s.querySelectorAll(".hint").forEach(n=>n.remove()));}
 function finish(win){ended=true;update();$("dialogTitle").textContent=win?"🎉 모두 찾았어요!":"💪 다시 도전해 보세요!";$("dialogText").innerHTML=win?"틀린 그림 5개를 모두 찾았습니다.<br>다음 문제의 정답은":"목숨을 모두 사용했어요.<br>다시 시작해서 도전해 보세요!";$("answer").style.display=win?"block":"none";$("answerNote").style.display=win?"block":"none";$("overlay").style.display="flex";}
 scenes.forEach(scene=>scene.addEventListener("click",e=>{
  if(ended)return;const r=scene.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  const HIT_RADIUS_SCALE=1.5;const i=diffs.findIndex((d,j)=>{if(found.has(j))return false;const rx=(d.w/2)*HIT_RADIUS_SCALE,ry=(d.h/2)*HIT_RADIUS_SCALE;const dx=(x-d.cx)/rx,dy=(y-d.cy)/ry;return dx*dx+dy*dy<=1;});
  if(i>=0){found.add(i);clearHints();scenes.forEach(s=>mark(s,i));$("status").textContent="정답! "+diffs[i].name+" 차이를 찾았어요.";$("status").style.color="#3f7544";update();if(found.size===5)finish(true);}
  else{lives--;$("status").textContent="여기는 정답 위치가 아니에요. 목숨이 하나 줄었어요.";$("status").style.color="#b54139";update();if(lives<=0)finish(false);}
 }));
 $("hintBtn").addEventListener("click",()=>{if(hints<=0||ended)return;const i=diffs.findIndex((d,j)=>!found.has(j));if(i<0)return;hints--;clearHints();scenes.forEach(s=>mark(s,i,"hint"));$("status").textContent="힌트: "+diffs[i].hint;$("status").style.color="#946a16";update();});
 function reset(){found=new Set();lives=3;hints=3;ended=false;clearHints();scenes.forEach(s=>s.querySelectorAll(".mark").forEach(n=>n.remove()));$("overlay").style.display="none";$("status").textContent="준비되면 그림에서 다른 곳을 찾아 눌러 보세요!";$("status").style.color="#4b704c";update();}
 $("resetBtn").addEventListener("click",reset);$("closeBtn").addEventListener("click",()=>{$("overlay").style.display="none";});$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))$("overlay").style.display="none";});update();
})();
</script></body></html>
